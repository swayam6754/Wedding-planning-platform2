{% extends "base.html" %}

{% block content %}
<h2>Wedding Checklist</h2>

<form method="POST" action="/add_task">
    <input type="text" name="task" placeholder="New wedding task" required>
    <button type="submit">Add Task</button>
</form>

<ul>
{% for t in tasks %}
    <li>
        {{ t[0] }}
        <a href="/delete_task/{{ t[0] }}">❌</a>
    </li>
{% endfor %}
</ul>
{% endblock %}
