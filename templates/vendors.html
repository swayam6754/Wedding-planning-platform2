{% extends "base.html" %}

{% block content %}
<h2>Wedding Vendors</h2>

<form method="POST" action="/add_vendor">
    <input type="text" name="name" placeholder="Vendor Name" required>
    <input type="text" name="category" placeholder="Category" required>
    <button type="submit">Add Vendor</button>
</form>

<ul>
{% for v in vendors %}
    <li>
        {{ v[0] }} - {{ v[1] }}
        <a href="/delete_vendor/{{ v[0] }}">❌</a>
    </li>
{% endfor %}
</ul>
{% endblock %}
